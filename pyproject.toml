[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comp"
version = "0.1.0"
description = "AI Competitive Exam Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "google-genai==2.28.0",
    "pydantic>=2.12,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]
postgres = [
    "psycopg[binary]>=3.3,<4.0",
]
server = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring an external PostgreSQL service",
]
