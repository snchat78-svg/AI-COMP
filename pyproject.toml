[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comp"
version = "0.1.0"
description = "AI Competitive Exam Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
