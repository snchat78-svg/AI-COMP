name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_comp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_comp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AI_COMP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_comp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,postgres]"
      - run: python -m pytest tests -q
