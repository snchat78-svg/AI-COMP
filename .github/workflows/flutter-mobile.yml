name: Flutter mobile client

on:
  push:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-mobile.yml"
      - "src/ai_comp/api/preparation_guidance_routes.py"
      - "src/ai_comp/api/preparation_client_contract.py"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter-mobile.yml"
      - "src/ai_comp/api/preparation_guidance_routes.py"
      - "src/ai_comp/api/preparation_client_contract.py"
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Flutter-generated Android wrapper files
        run: flutter create --platforms=android --project-name ai_comp_mobile --org com.aicomp --no-pub .

      - name: Prepare Firebase Android config
        id: firebase-config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            python -c "import json; json.load(open('android/app/google-services.json', encoding='utf-8'))"
            echo "firebase_configured=true" >> "$GITHUB_OUTPUT"
          else
            cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "aicomp-ci-placeholder",
              "storage_bucket": "aicomp-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.aicomp.ai_comp_mobile"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_ONLY_PLACEHOLDER_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "firebase_configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase secret unavailable; compiling with a CI-only placeholder. No APK artifact will be published."
          fi

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze

      - name: Run mobile client tests
        run: flutter test

      - name: Build release-mode Android APK for testing
        run: flutter build apk --release

      - name: Verify APK artifact
        if: steps.firebase-config.outputs.firebase_configured == 'true'
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK
        if: steps.firebase-config.outputs.firebase_configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-comp-mobile-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
