name: regional-official-source-probe

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/official-source-health/**"
      - "supabase/config.toml"
      - ".github/workflows/regional-official-source-probe.yml"
  pull_request:
    paths:
      - "supabase/functions/official-source-health/**"
      - "supabase/config.toml"
      - ".github/workflows/regional-official-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-comp-regional-official-source-probe
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check regional probe
        run: deno check supabase/functions/official-source-health/index.ts supabase/functions/official-source-health/index_test.ts

      - name: Test regional probe contract
        run: deno test --allow-env=SB_REGION supabase/functions/official-source-health/index_test.ts

  deploy-and-probe:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PROJECT_REF: edjxradbjzbuveizujzu
    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Mumbai regional source probe skipped"
              echo
              echo "Set the GitHub Actions secret SUPABASE_ACCESS_TOKEN to enable deployment of the diagnostic Edge Function."
              echo "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are also required. No secret values were printed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.config.outputs.ready == 'true'
        uses: supabase/setup-cli@v1

      - name: Deploy fixed-host diagnostic function
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy official-source-health             --project-ref "$SUPABASE_PROJECT_REF"             --use-api

      - name: Probe official robots.txt from Mumbai region
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response_file="regional-source-health.json"
          status_code="$(curl --silent --max-time 35 --output "$response_file" --write-out '%{http_code}'             --request POST "$SUPABASE_URL/functions/v1/official-source-health"             --header "apikey: $SUPABASE_SERVICE_ROLE_KEY"             --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             --header "Content-Type: application/json"             --header "x-region: ap-south-1"             --data '{"source_id":"all"}' || true)"

          if [ "$status_code" != "200" ]; then
            echo "::error::Regional source probe returned HTTP $status_code."
            {
              echo "## Mumbai regional source probe failed"
              echo
              echo "- Edge Function HTTP status: $status_code"
              echo "- Check the function deployment, JWT verification and its safe error response."
              echo "- Secret values are not printed."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$response_file" ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          try:
              body = json.loads(Path("regional-source-health.json").read_text(encoding="utf-8"))
              print(json.dumps(body, ensure_ascii=False))
          except (OSError, json.JSONDecodeError):
              print("The response body was not valid JSON.")
          PY
            fi
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("regional-source-health.json").read_text(encoding="utf-8"))
          if data.get("phase") != "2.6-regional-source-probe" or not isinstance(data.get("results"), list):
              raise SystemExit("The regional function response did not match the expected contract.")

          lines = [
              "# Mumbai regional official-source connectivity",
              "",
              f"- Function execution region: {data.get('execution_region', 'unknown')}",
              "- Probe: HTTPS GET to each registered official robots.txt only.",
              "- No paper content was downloaded and no database records were changed.",
              "",
              "| Registered source | Network result | robots.txt HTTP | Redirect followed | Duration (ms) |",
              "|---|---|---:|---|---:|",
          ]
          for item in data["results"]:
              lines.append(
                  "| {source} | {network} | {status} | {redirect} | {duration} |".format(
                      source=item.get("source_id", "unknown"),
                      network=item.get("network_status", "unknown"),
                      status=item.get("http_status", "—"),
                      redirect="no" if item.get("redirect_not_followed") else "n/a",
                      duration=item.get("duration_ms", "—"),
                  )
              )
              if item.get("error_type"):
                  lines.append(f"- {item.get('source_id', 'unknown')} error type: {item['error_type']}")
          Path("regional-source-health-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
          cat regional-source-health-summary.md >> "$GITHUB_STEP_SUMMARY"
