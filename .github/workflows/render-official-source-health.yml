name: render-official-source-health

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-official-source-health.yml"
      - "src/ai_comp/api/source_health_routes.py"
      - "src/ai_comp/api/app.py"
      - "src/ai_comp/research/source_health.py"
      - "src/ai_comp/research/jansoochna_service_probe.py"
      - "src/ai_comp/research/seed_registry.py"
      - "src/ai_comp/domain/exams.py"
      - "src/ai_comp/domain/sources.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/render-official-source-health.yml"
      - "src/ai_comp/api/source_health_routes.py"
      - "src/ai_comp/api/app.py"
      - "src/ai_comp/research/source_health.py"
      - "src/ai_comp/research/jansoochna_service_probe.py"
      - "src/ai_comp/research/seed_registry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-comp-render-official-source-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository for fixed-host runner diagnostic
        uses: actions/checkout@v4

      - name: Probe fixed official hosts from GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m ai_comp.research.source_health --source all > github-runner-source-health.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("github-runner-source-health.json").read_text(encoding="utf-8"))
          if data.get("phase") != "2.5-source-health" or not isinstance(data.get("results"), list):
              raise SystemExit("GitHub-runner source-health report did not match its fixed diagnostic contract.")
          rows = list(data["results"])
          control = data.get("network_control")
          if isinstance(control, dict):
              rows.append(control)
          portal_controls = data.get("government_portal_controls")
          if isinstance(portal_controls, list):
              rows.extend(item for item in portal_controls if isinstance(item, dict))
          lines = [
              "# Fixed-host connectivity from GitHub-hosted runner",
              "",
              "- Diagnostic only: standard DNS, TCP and certificate-validated TLS. No page/paper bytes fetched.",
              "- Raw IP addresses, cookies and URL query values are not printed.",
              "",
              "| Fixed source/control | DNS | IPv4 addresses | IPv4 TCP | IPv4 TLS | IPv6 addresses | IPv6 TCP | IPv6 TLS |",
              "|---|---|---:|---|---|---:|---|---|",
          ]
          for item in rows:
              lines.append(
                  "| {name} ({host}) | {dns} | {v4n} | {v4tcp} | {v4tls} | {v6n} | {v6tcp} | {v6tls} |".format(
                      name=item.get("source_id", "unknown"),
                      host=item.get("host", "unknown"),
                      dns=item.get("dns_status", "unknown"),
                      v4n=item.get("ipv4_records", "unknown"),
                      v4tcp=item.get("ipv4_tcp", "unknown"),
                      v4tls=item.get("ipv4_tls", "unknown"),
                      v6n=item.get("ipv6_records", "unknown"),
                      v6tcp=item.get("ipv6_tcp", "unknown"),
                      v6tls=item.get("ipv6_tls", "unknown"),
                  )
              )
              for key in ("ipv4_tcp_errors", "ipv4_tls_errors", "ipv6_tcp_errors", "ipv6_tls_errors"):
                  errors = item.get(key, [])
                  if errors:
                      lines.append(f"- {item.get('source_id', 'unknown')} {key}: {', '.join(str(e) for e in errors)}")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Query deployed Render source-health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://ai-comp-api.onrender.com/diagnostics/official-source-health"
          found=false

          # A main push starts Render auto-deploy and this workflow near the same
          # time. Retry for a bounded window until the new diagnostic route exists.
          for attempt in $(seq 1 18); do
            status_code="$(curl --silent --max-time 10 --output render-source-health.json --write-out '%{http_code}' "$url" || true)"
            if [ "$status_code" = "200" ] && python -c 'import json, pathlib, sys; d=json.loads(pathlib.Path("render-source-health.json").read_text(encoding="utf-8")); results=d.get("results"); seen={item.get("source_id") for item in results if isinstance(item, dict)} if isinstance(results, list) else set(); control=d.get("network_control"); portals=d.get("government_portal_controls"); portal_ids={item.get("source_id") for item in portals if isinstance(item, dict)} if isinstance(portals, list) else set(); expected={"RAJASTHAN_RECRUITMENT_PORTAL_CONTROL", "RAJASTHAN_LANDREVENUE_PORTAL_CONTROL", "JANSOOCHNA_RSSB_PAPERS_CONTROL"}; sys.exit(0 if d.get("phase") == "2.5-source-health" and "RSSB_LEGACY_OFFICIAL" in seen and isinstance(control, dict) and control.get("source_id") == "NETWORK_CONTROL" and control.get("host") == "example.com" and expected.issubset(portal_ids) else 1)'; then
              echo "Render source-health endpoint responded with the updated official-source registry (attempt $attempt)."
              found=true
              break
            fi
            rm -f render-source-health.json
            sleep 4
          done

          if [ "$found" != "true" ]; then
            echo "::error::Could not retrieve a valid source-health response from the deployed Render service."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("render-source-health.json").read_text(encoding="utf-8"))
          lines = [
              "# Render official-source connectivity",
              "",
              "- Diagnostic only; no paper content was fetched and no database records were changed.",
              f"- Cache result: {'cached' if data.get('cache', {}).get('cached') else 'fresh'}",
              "",
              "| Registered source | DNS | IPv4 TCP | IPv4 TLS | IPv6 TCP | IPv6 TLS |",
              "|---|---|---|---|---|---|",
          ]
          for item in data.get("results", []):
              lines.append(
                  "| {source} | {dns} | {v4tcp} | {v4tls} | {v6tcp} | {v6tls} |".format(
                      source=item.get("source_id", "unknown"),
                      dns=item.get("dns_status", "unknown"),
                      v4tcp=item.get("ipv4_tcp", "unknown"),
                      v4tls=item.get("ipv4_tls", "unknown"),
                      v6tcp=item.get("ipv6_tcp", "unknown"),
                      v6tls=item.get("ipv6_tls", "unknown"),
                  )
              )
              for label in ("ipv4_tcp_errors", "ipv4_tls_errors", "ipv6_tcp_errors", "ipv6_tls_errors"):
                  errors = item.get(label, [])
                  if errors:
                      lines.append(f"- {item.get('source_id', 'unknown')} {label}: {', '.join(errors)}")
          control = data.get("network_control")
          if isinstance(control, dict):
              lines.extend([
                  "",
                  "## General HTTPS control (fixed host; diagnostic only)",
                  "- Control hostname: example.com",
                  f"- DNS={control.get('dns_status', 'unknown')}; "
                  f"IPv4 TCP={control.get('ipv4_tcp', 'unknown')}; "
                  f"IPv4 TLS={control.get('ipv4_tls', 'unknown')}; "
                  f"IPv6 TCP={control.get('ipv6_tcp', 'unknown')}; "
                  f"IPv6 TLS={control.get('ipv6_tls', 'unknown')}",
              ])
              for label in ("ipv4_tcp_errors", "ipv4_tls_errors", "ipv6_tcp_errors", "ipv6_tls_errors"):
                  errors = control.get(label, [])
                  if errors:
                      lines.append(f"- Network control {label}: {', '.join(errors)}")
          else:
              lines.extend(["", "## General HTTPS control", "- Not present in this report."])
          portal_controls = data.get("government_portal_controls")
          lines.extend([
              "",
              "## Potential public government routes (diagnostic only; not approved paper sources)",
              "| Fixed government portal | DNS | IPv4 TCP | IPv4 TLS | IPv6 TCP | IPv6 TLS |",
              "|---|---|---|---|---|---|",
          ])
          for item in portal_controls if isinstance(portal_controls, list) else []:
              lines.append(
                  "| {source} ({host}) | {dns} | {v4tcp} | {v4tls} | {v6tcp} | {v6tls} |".format(
                      source=item.get("source_id", "unknown"),
                      host=item.get("host", "unknown"),
                      dns=item.get("dns_status", "unknown"),
                      v4tcp=item.get("ipv4_tcp", "unknown"),
                      v4tls=item.get("ipv4_tls", "unknown"),
                      v6tcp=item.get("ipv6_tcp", "unknown"),
                      v6tls=item.get("ipv6_tls", "unknown"),
                  )
              )
              for label in ("ipv4_tcp_errors", "ipv4_tls_errors", "ipv6_tcp_errors", "ipv6_tls_errors"):
                  errors = item.get(label, [])
                  if errors:
                      lines.append(f"- {item.get('source_id', 'unknown')} {label}: {', '.join(errors)}")
          Path("render-source-health-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
          cat render-source-health-summary.md >> "$GITHUB_STEP_SUMMARY"
          # Inspect the public Jan Soochna RSSB service index separately from the
          # official-source acceptance gate. This diagnostic follows robots.txt
          # and never fetches any paper/answer-key documents.
          service_url="https://ai-comp-api.onrender.com/diagnostics/jansoochna-rssb-service"
          service_found=false
          service_status="not_attempted"

          # Render can roll the API process behind the source-health endpoint
          # during a deploy. Retry the fixed diagnostic route briefly until the
          # route and its expected response schema are present.
          for service_attempt in $(seq 1 18); do
            service_status="$(curl --silent --max-time 10 --output jansoochna-service-probe.json --write-out '%{http_code}' "$service_url" || true)"
            if [ "$service_status" = "200" ]; then
              # Preserve the most recent HTTP-200 body for a sanitized schema
              # diagnostic if it never matches the expected response contract.
              cp jansoochna-service-probe.json jansoochna-service-probe-last.json
              if python -c 'import json, pathlib, sys; d=json.loads(pathlib.Path("jansoochna-service-probe.json").read_text(encoding="utf-8")); sys.exit(0 if d.get("phase") == "2.5-jansoochna-public-service-probe" and d.get("host") == "jansoochna.rajasthan.gov.in" and isinstance(d.get("pages_fetched"), list) and isinstance(d.get("robots"), dict) and (isinstance(d.get("service_link_inspections"), list) or d.get("status") in {"ROBOTS_UNAVAILABLE", "ROBOTS_CONTENT_TYPE_INVALID"}) else 1)'; then
                echo "Jan Soochna diagnostic endpoint responded with the expected fixed-host contract (attempt $service_attempt)."
                service_found=true
                break
              fi
            fi
            rm -f jansoochna-service-probe.json
            sleep 4
          done

          if [ "$service_found" != "true" ]; then
            if [ "$service_status" = "200" ] && [ -f jansoochna-service-probe-last.json ]; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          raw = Path("jansoochna-service-probe-last.json").read_text(encoding="utf-8")
          try:
              data = json.loads(raw)
          except ValueError:
              data = None
          lines = [
              "# Jan Soochna diagnostic response — schema mismatch",
              "",
              "- The fixed diagnostic endpoint returned HTTP 200, but the response did not match the expected schema after bounded retries.",
              "- Only structural metadata is shown below; response bodies, cookies, query values, and linked URLs are not printed.",
              "",
          ]
          if not isinstance(data, dict):
              lines.append("- JSON object: invalid or unexpected")
          else:
              lines.extend([
                  "- Top-level keys: " + ", ".join(sorted(str(k) for k in data.keys())[:40]),
                  "- Phase: " + str(data.get("phase", "missing"))[:100],
                  "- Host: " + str(data.get("host", "missing"))[:100],
                  "- Status: " + str(data.get("status", "missing"))[:100],
                  "- Robots status: " + str((data.get("robots") or {}).get("status", "missing"))[:100] if isinstance(data.get("robots"), dict) else "- Robots object: missing or wrong type",
                  "- pages_fetched type: " + type(data.get("pages_fetched")).__name__,
                  "- service_link_inspections type: " + type(data.get("service_link_inspections")).__name__,
              ])
              inspections = data.get("service_link_inspections")
              if isinstance(inspections, list):
                  lines.append("- Service inspections count: " + str(len(inspections)))
                  for item in inspections[:6]:
                      if not isinstance(item, dict):
                          lines.append("  - Non-object inspection record")
                          continue
                      path = str(item.get("path", ""))
                      safe_path = urlsplit(path).path[:160]
                      lines.append(
                          "  - path={}; status={}; robots_allowed={}; HTTP={}; content_type={}; "
                          "redirect_host={}; redirect_scheme={}; redirect_path={}; "
                          "second_redirect_host={}; second_redirect_path={}".format(
                              safe_path,
                              str(item.get("status", "missing"))[:80],
                              str(item.get("robots_allowed", "unknown"))[:20],
                              str(item.get("redirect_target_http_status", "missing"))[:20],
                              str(item.get("redirect_target_content_type", "missing"))[:80],
                              str(item.get("redirect_target_host", "missing"))[:120],
                              str(item.get("redirect_target_scheme", "missing"))[:20],
                              urlsplit(str(item.get("redirect_target_path", ""))).path[:160],
                              str(item.get("redirect_chain_target_host", "missing"))[:120],
                              urlsplit(str(item.get("redirect_chain_target_path", ""))).path[:160],
                          )
                      )
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
              if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                echo "::warning::Jan Soochna endpoint responded but its schema is not recognized; see sanitized structural details above."
                exit 0
              fi
            fi
            echo "::error::Could not retrieve a valid fixed Jan Soochna diagnostic response after bounded retries (last HTTP $service_status)."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("jansoochna-service-probe.json").read_text(encoding="utf-8"))
          if data.get("phase") != "2.5-jansoochna-public-service-probe" or data.get("host") != "jansoochna.rajasthan.gov.in":
              raise SystemExit("Jan Soochna diagnostic response did not match its fixed-host contract.")

          lines = [
              "# Jan Soochna RSSB public-service route inspection",
              "",
              "- Read-only diagnostic; only robots.txt and explicitly permitted public HTML index pages are fetched.",
              "- No paper or answer-key bytes fetched; no database records or source registry changed.",
              f"- Overall route status: {data.get('status', 'unknown')}",
              f"- robots.txt status: {data.get('robots', {}).get('status', 'unknown')}",
          ]
          robots = data.get("robots", {})
          if isinstance(robots, dict):
              lines.append(f"- Robots permission: /Services={robots.get('can_fetch_services', 'unknown')}; /Scheme={robots.get('can_fetch_scheme', 'unknown')}")

          for page in data.get("pages_fetched", []):
              lines.append("")
              lines.append(f"## {page.get('path', 'unknown')} — {page.get('status', 'unknown')}")
              if page.get("http_status") is not None:
                  lines.append(f"- HTTP status: {page.get('http_status')}")
              for key, title in (("question_papers", "RSSB question-paper service links"), ("answer_keys", "RSSB answer-key service links")):
                  links = page.get(key, [])
                  if links:
                      lines.append(f"- {title}:")
                      for item in links:
                          if item.get("same_host") is True:
                              lines.append(f"  - Same-host public link (not fetched): {item.get('url', '')}")
                          else:
                              lines.append(f"  - External link not followed; target host: {item.get('target_host', 'unknown')}")
          for inspection in data.get("service_link_inspections", []):
              lines.append("")
              lines.append(
                  "## Service detail {path} — {status} (robots allowed={allowed})".format(
                      path=inspection.get("path", "unknown"),
                      status=inspection.get("status", "unknown"),
                      allowed=inspection.get("robots_allowed", "unknown"),
                  )
              )
              if inspection.get("redirect_target_host"):
                  lines.append(
                      "  - Redirect not followed; target host={host}, scheme={scheme}, path={path}".format(
                          host=inspection.get("redirect_target_host", "unknown"),
                          scheme=inspection.get("redirect_target_scheme", "unknown"),
                          path=inspection.get("redirect_target_path", "/"),
                      )
                  )
              if inspection.get("redirect_target_status"):
                  lines.append(
                      "  - Target inspection: {status}; robots allowed={allowed}; HTTP={http}; content type={content_type}".format(
                          status=inspection.get("redirect_target_status", "unknown"),
                          allowed=inspection.get("redirect_target_robots_allowed", "unknown"),
                          http=inspection.get("redirect_target_http_status", "unknown"),
                          content_type=inspection.get("redirect_target_content_type", "unknown"),
                      )
                  )
              if inspection.get("redirect_chain_target_host"):
                  lines.append(
                      "  - Second redirect also not followed; target host={host}, scheme={scheme}, path={path}".format(
                          host=inspection.get("redirect_chain_target_host", "unknown"),
                          scheme=inspection.get("redirect_chain_target_scheme", "unknown"),
                          path=inspection.get("redirect_chain_target_path", "/"),
                      )
                  )
              for item in inspection.get("redirect_target_document_links", []):
                  if item.get("same_host") is True:
                      lines.append(
                          "  - Redirect-target {kind} (not fetched): {url}".format(
                              kind=item.get("kind", "PUBLIC_LINK_NOT_FETCHED"),
                              url=item.get("url", ""),
                          )
                      )
                  else:
                      lines.append(
                          "  - Redirect-target {kind}: external link not followed (target host={host})".format(
                              kind=item.get("kind", "PUBLIC_LINK_NOT_FETCHED"),
                              host=item.get("target_host", "unknown"),
                          )
                      )
              for item in inspection.get("document_links", []):
                  if item.get("same_host") is True:
                      lines.append("  - {kind}: {url}".format(kind=item.get("kind", "PUBLIC_LINK_NOT_FETCHED"), url=item.get("url", "")))
                  else:
                      lines.append("  - {kind}: external link not followed (target host={host})".format(kind=item.get("kind", "PUBLIC_LINK_NOT_FETCHED"), host=item.get("target_host", "unknown")))
          lines.append("")
          lines.append("- Confirmed: no paper or answer-key file bytes were fetched.")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY


      # Pull-request runs expose a live, read-only production diagnostic summary so
      # the report can be inspected through the PR workflow. The actual official-source
      # acceptance gate remains enforced on main pushes and explicit manual runs.
      - name: Query fixed recruitment portal route diagnostic
        shell: bash
        run: |
          set -euo pipefail
          url="https://ai-comp-api.onrender.com/diagnostics/recruitment-portal-paper-route"
          found=false
          last_status="not_attempted"
          for attempt in $(seq 1 18); do
            last_status="$(curl --silent --max-time 10 --output recruitment-portal-route.json --write-out '%{http_code}' "$url" || true)"
            if [ "$last_status" = "200" ] && python -c 'import json, pathlib, sys; d=json.loads(pathlib.Path("recruitment-portal-route.json").read_text(encoding="utf-8")); sys.exit(0 if d.get("phase") == "2.2-recruitment-portal-route-probe" and d.get("host") == "recruitment.rajasthan.gov.in" and isinstance(d.get("pages_inspected"), list) and isinstance(d.get("robots"), dict) and d.get("source_registry_modified") is False and d.get("paper_bytes_fetched") is False and d.get("database_written") is False and d.get("candidate_promotions") == 0 else 1)'; then
              found=true
              break
            fi
            sleep 4
          done

          if [ "$found" != "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Recruitment portal diagnostic is not deployed yet; the post-merge main workflow must capture the live result."
              exit 0
            fi
            echo "::error::Could not retrieve the fixed recruitment portal diagnostic response (last HTTP $last_status)."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("recruitment-portal-route.json").read_text(encoding="utf-8"))
          lines = [
              "# Official recruitment portal route probe (diagnostic only)",
              "",
              f"- Overall status: {data.get('status', 'unknown')}",
              f"- robots.txt: {(data.get('robots') or {}).get('status', 'unknown') if isinstance(data.get('robots'), dict) else 'missing'}",
              f"- Pages inspected: {len(data.get('pages_inspected', [])) if isinstance(data.get('pages_inspected'), list) else 0}",
              "- Paper/answer-key bytes fetched: false",
              "- Database/source registry changed: false",
              "- Candidate promoted: 0",
              "",
              "| Fixed public index path | Outcome | Relevant links found |",
              "|---|---|---:|",
          ]
          for page in data.get("pages_inspected", []):
              if not isinstance(page, dict):
                  continue
              links = page.get("paper_links")
              lines.append(
                  "| {path} | {status} | {count} |".format(
                      path=str(page.get("path", ""))[:120],
                      status=str(page.get("status", "unknown"))[:80],
                      count=len(links) if isinstance(links, list) else 0,
                  )
              )
              if isinstance(links, list):
                  for link in links[:10]:
                      if not isinstance(link, dict):
                          continue
                      lines.append(
                          "- Link metadata only: label={}; host={}; path={}; same_host={}; status={}".format(
                              str(link.get("label", ""))[:100],
                              str(link.get("target_host", ""))[:120],
                              str(link.get("path", ""))[:180],
                              str(link.get("same_host", "unknown")),
                              str(link.get("status", "unknown"))[:80],
                          )
                      )
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Require at least one official source to complete validated TCP and TLS
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("render-source-health.json").read_text(encoding="utf-8"))
          results = data.get("results", [])
          reachable = [
              item.get("source_id", "unknown")
              for item in results
              if any(
                  item.get(f"{family}_tcp") == "PASS"
                  and item.get(f"{family}_tls") == "PASS"
                  for family in ("ipv4", "ipv6")
              )
          ]
          if reachable:
              print("Validated official-source TCP/TLS available for: " + ", ".join(reachable))
          else:
              print(
                  "::error::No registered official exam source completed both TCP connect "
                  "and certificate-validated TLS. See the published table above; discovery "
                  "must remain blocked until an allowed official HTTPS endpoint is reachable."
              )
              raise SystemExit(1)
          PY
